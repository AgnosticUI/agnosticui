name: Check Codegen Consistency

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  check-codegen:
    runs-on: ubuntu-24.04 # Pinned stable runner architecture to eliminate Ubuntu 26.04 drift anomalies

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (v2/sdui/schema)
        run: npm ci
        working-directory: v2/sdui/schema

      - name: Install dependencies (v2/lib)
        run: npm ci
        working-directory: v2/lib

      # Audit committed files directly BEFORE executing any code regeneration passes
      - name: Check for Committed Codegen Drift
        run: |
          if ! npm run check-codegen; then
            echo ""
            echo "========================================================================"
            echo " ❌ CODEGEN DRIFT DETECTED!"
            echo "========================================================================"
            echo "Your committed generated schema or types files do not match the current"
            echo "core component definitions, interfaces, or configurations."
            echo ""
            echo "Please run these exact steps locally in your terminal to synchronize:"
            echo ""
            echo "  cd v2/sdui/schema"
            echo "  npm run codegen -- --emit-schema-json"
            echo "  npm run check-codegen"
            echo ""
            echo "Once completed, add, commit, and push the updated files to your PR branch."
            echo "========================================================================"
            echo ""
            exit 1
          fi
        working-directory: v2/sdui/schema

      # Regenerate and compile ONLY after the initial pre-flight check has passed successfully
      - name: Verify Codegen Execution and Build Toolchain Stability
        run: |
          npm run codegen -- --emit-schema-json
          npm run build
        working-directory: v2/sdui/schema
