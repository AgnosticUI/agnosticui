name: Check Codegen Consistency

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  check-codegen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (v2/sdui/schema)
        run: npm ci
        working-directory: v2/sdui/schema

      - name: Install dependencies (v2/lib)
        run: npm ci
        working-directory: v2/lib

      - name: Generate schemas and check codegen drift
        run: |
          # 1. Force a fresh build loop execution of code configurations
          npm run codegen -- --emit-schema-json
          
          # 2. Intercept check failures cleanly to print friendly error instructions
          if ! npm run check-codegen; then
            echo ""
            echo "========================================================================"
            echo " ❌ CODEGEN DRIFT DETECTED!"
            echo "========================================================================"
            echo "Your underlying core component definitions, interfaces, or config files"
            echo "do not match the currently committed output files."
            echo ""
            echo "Please run these exact steps locally in your terminal to synchronize:"
            echo ""
            echo "  cd v2/sdui/schema"
            echo "  npm run codegen -- --emit-schema-json"
            echo "  npm run check-codegen"
            echo ""
            echo "Once completed, add, commit, and push the updated files to your PR branch."
            echo "========================================================================"
            echo ""
            exit 1
          fi
        working-directory: v2/sdui/schema
