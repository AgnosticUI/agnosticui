name: Check Codegen Consistency

on:
  push:
    branches: [ master, main, A2UI-experiment ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  check-codegen:
    runs-on: ubuntu-24.04 # Pinned stable runner architecture to eliminate Ubuntu 26.04 drift anomalies

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (v2/lib)
        run: npm ci
        working-directory: v2/lib

      - name: Install dependencies (v2/a2ui/catalog)
        run: npm ci
        working-directory: v2/a2ui/catalog

      - name: Install dependencies (v2/a2ui/renderers/lit)
        run: npm ci
        working-directory: v2/a2ui/renderers/lit

      - name: Check for Committed A2UI v1.0 Codegen Drift
        run: |
          if ! npm run check; then
            echo ""
            echo "========================================================================"
            echo " ❌ A2UI v1.0 CODEGEN DRIFT DETECTED!"
            echo "========================================================================"
            echo "Your committed agnosticui-catalog.json, SKILL.md, Lit wrappers, or"
            echo "v2/site/docs/public/a2ui/v1/catalog.json do not match v2/lib interfaces."
            echo ""
            echo "Please run these exact steps locally in your terminal to synchronize:"
            echo ""
            echo "  cd v2/a2ui/catalog"
            echo "  npm run generate"
            echo "  npm run check"
            echo ""
            echo "Once completed, add, commit, and push the updated files to your PR branch."
            echo "========================================================================"
            echo ""
            exit 1
          fi
        working-directory: v2/a2ui/catalog

      - name: Verify @agnosticui/a2ui-lit Tests and Build
        run: |
          npm test
          npm run build
        working-directory: v2/a2ui/renderers/lit
