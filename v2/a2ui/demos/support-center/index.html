<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgnosticUI × A2UI v1.0 — Generative UI & 21-Skin Live Studio</title>
  <link rel="stylesheet" href="../../../skins/skins-bundle.css" />
  <link rel="stylesheet" href="./src/studio.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--ag-font-family-sans, system-ui, -apple-system, sans-serif);
      background: var(--ag-background-secondary, #f4f5f7);
      color: var(--ag-text-primary, #111827);
    }
    .studio-shell {
      display: grid;
      grid-template-columns: 360px 1fr 340px;
      min-height: 100vh;
    }
    .panel {
      padding: 1.25rem;
      background: var(--ag-background-primary, #ffffff);
      border-right: 1px solid var(--ag-border, #e5e7eb);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .panel-right {
      border-right: none;
      border-left: 1px solid var(--ag-border, #e5e7eb);
    }
    .canvas-port {
      padding: 2rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .skin-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.4rem;
      max-height: 290px;
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .skin-btn {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.4rem 0.55rem;
      border: 1px solid var(--ag-border, #d1d5db);
      border-radius: 6px;
      background: var(--ag-background-primary, #fff);
      color: var(--ag-text-primary, #111);
      font-size: 0.78rem;
      cursor: pointer;
      text-align: left;
    }
    .skin-btn[aria-pressed="true"] {
      border-color: var(--ag-primary, #297aff);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--ag-primary, #297aff) 25%, transparent);
      font-weight: 600;
    }
    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      flex-shrink: 0;
      border: 1px solid rgba(0, 0, 0, 0.15);
    }
    pre.json-inspector {
      margin: 0;
      padding: 0.75rem;
      border-radius: 8px;
      background: var(--ag-background-tertiary, #111827);
      color: var(--ag-text-primary, #e5e7eb);
      font-size: 0.75rem;
      line-height: 1.45;
      overflow: auto;
      max-height: 360px;
      border: 1px solid var(--ag-border, #374151);
    }
    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    select, button.ctrl-btn {
      padding: 0.45rem 0.65rem;
      border-radius: 6px;
      border: 1px solid var(--ag-border, #d1d5db);
      background: var(--ag-background-primary, #fff);
      color: var(--ag-text-primary, #111);
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="studio-shell">
    <!-- Left: Scenario Streamer & 21-Skin Design System Switcher -->
    <aside class="panel">
      <div>
        <h2 style="margin: 0 0 0.25rem; font-size: 1.05rem;">AgnosticUI × A2UI v1.0</h2>
        <p style="margin: 0; font-size: 0.8rem; opacity: 0.8;">
          Same A2UI JSON payload • 21 runtime skins • FACE validation
        </p>
      </div>

      <div>
        <label for="scenario-select" style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem;">
          A2UI v1.0 Stream Fixture
        </label>
        <select id="scenario-select" style="width: 100%;"></select>
        <div class="row-between" style="margin-top: 0.5rem;">
          <button id="replay-btn" class="ctrl-btn" type="button" style="flex: 1;">Replay Stream (120ms)</button>
          <button id="validate-btn" class="ctrl-btn" type="button">Run FACE Check</button>
        </div>
      </div>

      <div class="row-between">
        <span style="font-size: 0.82rem; font-weight: 600;">Theme Mode</span>
        <button id="dark-toggle" class="ctrl-btn" type="button">Toggle Dark Mode</button>
      </div>

      <div>
        <div class="row-between" style="margin-bottom: 0.4rem;">
          <span style="font-size: 0.82rem; font-weight: 600;">Runtime Skin (21 Themes)</span>
          <span id="active-skin-label" style="font-size: 0.75rem; opacity: 0.75;">Default</span>
        </div>
        <div id="skin-grid" class="skin-grid"></div>
      </div>
    </aside>

    <!-- Center: Live <a2ui-surface> Light-DOM Render Port -->
    <section class="canvas-port">
      <div id="prompt-banner" style="font-size: 0.82rem; padding: 0.65rem 0.9rem; border-radius: 8px; background: var(--ag-background-primary, #fff); border: 1px solid var(--ag-border, #e5e7eb);"></div>
      <div id="surface-mount"></div>
    </section>

    <!-- Right: Live DataModel & Action Event Telemetry -->
    <aside class="panel panel-right">
      <div>
        <h3 style="margin: 0 0 0.35rem; font-size: 0.92rem;">Live A2UI DataModel (@path)</h3>
        <pre id="datamodel-inspector" class="json-inspector">{}</pre>
      </div>
      <div>
        <h3 style="margin: 0 0 0.35rem; font-size: 0.92rem;">Action & FACE Event Log</h3>
        <pre id="event-log" class="json-inspector" style="max-height: 220px;">Ready.</pre>
      </div>
    </aside>
  </main>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
