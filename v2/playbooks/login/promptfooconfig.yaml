description: "AgnosticUI Playbook Quality Evaluation Suite"

prompts:
  - "./PROMPTFOO-REACT.md"

providers:
  - id: ollama:chat:qwen2.5-coder:1.5b
    config:
      baseUrl: http://127.0.0.1:11434
      temperature: 0.1
      options:
        num_ctx: 8192
        num_predict: 512

tests:
  - assert:
      - type: not-contains
        value: "module.css"
        description: "Enforce: Do NOT use CSS Modules for layout styles."

      - type: not-contains
        value: "ReactCard.Header"
        description: "Enforce: Catch and reject dot-notation component hallucinations."

      # Swapped from a strict string match to a robust JavaScript quote handler
      - type: javascript
        value: output.includes('./components/ag/') || output.includes('"./components/ag/') || output.includes("'./components/ag/")
        description: "Verify that component imports map to local workspace paths."

      - type: contains
        value: 'slot="addon-left"'
        description: "Verify that native AgnosticUI layout slot patterns are correctly implemented."

      - type: icontains
        value: "ReactDivider"
        description: "Confirm structural ReactDivider wrapper components are utilized."

      - type: javascript
        value: output.includes('ReactButton') && output.includes('ReactInput')
        description: "Verify essential structural input and action primitives are present."

      # New Assertion: Ensures the model only consumes, never re-implements, the primitives
      - type: not-contains
        value: "export default const ReactButton"
        description: "Enforce Governance: Model must not re-implement core framework primitives."

      - type: not-contains
        value: "export const ReactInput"
        description: "Enforce Governance: Model must not write custom input primitive implementations."

      - type: contains
        value: "<form"
        description: "Accessibility: Core structure must be wrapped within a semantic native form tag."

      - type: contains
        value: 'type="submit"'
        description: "Verify action button explicitly declares submission type execution."

      - type: javascript
        value: "output.includes('ReactButton') && output.includes('ReactInput') && output.includes('ReactLink') && output.includes('ReactCheckbox')"
        description: "Verify essential structural and behavioral layout primitives are present."

      - type: not-contains
        value: "export default const ReactButton"
        description: "Enforce Governance: Model must not re-implement core framework primitives."

      - type: not-contains
        value: "export const ReactInput"
        description: "Enforce Governance: Model must not write custom input primitive implementations."

      # Enforce strict deterministic component import path mapping
      - type: javascript
        value: |
          const validButton = output.includes('import { ReactButton } from "./components/ag/Button/react/ReactButton"');
          const validInput = output.includes('import { ReactInput } from "./components/ag/Input/react/ReactInput"');
          const validDivider = output.includes('import { ReactDivider } from "./components/ag/Divider/react/ReactDivider"');
          const validLink = output.includes('import { ReactLink } from "./components/ag/Link/react/ReactLink"');
          const validCheckbox = output.includes('import { ReactCheckbox } from "./components/ag/Checkbox/react/ReactCheckbox"');

          return validButton && validInput && validDivider && validLink && validCheckbox;
        description: "Enforce Architecture: Verify all components strictly map to their isolated relative package paths."
