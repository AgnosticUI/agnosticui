description: "AgnosticUI Onboarding Playbook Quality Evaluation Suite"

prompts:
  - "./PROMPTFOO-REACT.md"

providers:
  - id: ollama:completion:qwen2.5-coder:1.5b
    config:
      baseUrl: http://127.0.0.1:11434
      temperature: 0.0 # Absolute determinism
      options:
        num_ctx: 4096 # Smaller focus window so it doesn't lose attention
        num_predict: 512 # Strict cap forcing a fast, clean structural skeleton
        repeat_penalty: 1.2 # Actively penalizes repeating components in wrong paths

tests:
  - assert:
      - type: not-contains
        value: "module.css"
        description: "CSS Architecture: Do NOT use CSS Modules for layout styles."

      - type: not-contains
        value: "--ag-border-radius-md"
        description: "Governance: Reject usage of the deprecated border-radius design token."

      # 1. Verification of Isolated Component Package Paths (Strict Line Matching)
      - type: javascript
        value: |
          const lines = output.split('\n');
          const hasMacroButtonHallucination = lines.some(line => line.includes('ReactProgress') && line.includes('/Button/'));

          const validButton = output.includes('import { ReactButton } from "./components/ag/Button/react/ReactButton"');
          const validProgress = output.includes('import { ReactProgress } from "./components/ag/Progress/react/ReactProgress"');
          const validAlert = output.includes('import { ReactAlert } from "./components/ag/Alert/react/ReactAlert"');
          const validGroup = output.includes('import { ReactSelectionCardGroup } from "./components/ag/SelectionCardGroup/react/ReactSelectionCardGroup"');
          const validCard = output.includes('import { ReactSelectionCard } from "./components/ag/SelectionCard/react/ReactSelectionCard"');

          return validButton && validProgress && validAlert && validGroup && validCard && !hasMacroButtonHallucination;
        description: "Enforce Architecture: Verify all onboarding complex layout primitives strictly resolve to their separate isolated package paths."

      # 2. State Machine Logic Verifications
      - type: contains
        value: "ReactSelectionCardGroup"
        description: "State Verification: Ensure multi-selection group containers are declared."

      - type: javascript
        value: output.includes('type="radio"') && output.includes('type="checkbox"')
        description: "Verify that card groups support both radio pathing and checkbox multiple interest options."

      - type: contains
        value: "ReactProgress"
        description: "Verify that the structural progress indicator tracks wizard state values."

      - type: javascript
        value: |
          const text = output.toLowerCase();
          return text.includes('currentposition < total_positions') || text.includes('progressvalue < 5') || text.includes('currentposition === total_positions');
        description: "Verify that the Next/Continue action button alters its behavior or boundaries on the final wizard step."
