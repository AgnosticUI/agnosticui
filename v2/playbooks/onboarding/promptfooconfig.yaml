description: "AgnosticUI Onboarding Playbook Quality Evaluation Suite"

prompts:
  - "./PROMPTFOO-REACT.md"

providers:
  - id: ollama:completion:qwen2.5-coder:1.5b
    config:
      baseUrl: http://127.0.0.1:11434
      temperature: 0.1
      options:
        num_ctx: 8192
        num_predict: 2048

tests:
  - assert:
      - type: not-contains
        value: "module.css"
        description: "CSS Architecture: Do NOT use CSS Modules for layout styles."

      - type: not-contains
        value: "--ag-border-radius-md"
        description: "Governance: Reject usage of the deprecated border-radius design token."

      # 1. Broad Verification of AgnosticUI Primitives Presence (Safe & Pragmatic)
      - type: javascript
        value: |
          const text = output.toLowerCase();
          return text.includes('reactbutton') && 
                 text.includes('reactprogress') && 
                 text.includes('reactalert') && 
                 text.includes('reactselectioncardgroup');
        description: "Verify all essential onboarding structural and layout framework components are imported."

      # 2. State Machine Logic Verifications
      - type: contains
        value: "ReactSelectionCardGroup"
        description: "State Verification: Ensure multi-selection group containers are declared."

      - type: javascript
        value: output.includes('type="radio"') && output.includes('type="checkbox"')
        description: "Verify that card groups support both radio pathing and checkbox multiple interest options."

      - type: contains
        value: "ReactProgress"
        description: "Verify that the structural progress indicator tracks wizard state values."

      # 3. Functional Interaction Handlers Verifications
      - type: contains
        value: "handleBack"
        description: "Verify the implementation of the backward step navigation state handler."

      - type: contains
        value: "handleNext"
        description: "Verify the implementation of the forward step navigation state handler."
